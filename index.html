        // Theo dõi trạng thái kết nối mạng của hệ thống với Firebase
        function loadHistory() {
            const startVal = document.getElementById('start-date').value;
            const endVal = document.getElementById('end-date').value;

            if (!startVal || !endVal) {
                alert("Vui lòng chọn đầy đủ thời gian bắt đầu và kết thúc!");
                return;
            }

            const startTime = new Date(startVal).getTime();
            const endTime = new Date(endVal).getTime();

            if (startTime > endTime) {
                alert("Thời gian bắt đầu không thể lớn hơn thời gian kết thúc!");
                return;
            }

            // Tự động nhận diện ID thiết bị đang được mở để load đúng nhánh lịch sử trên Firebase
            const deviceId = (typeof currentSubListener !== 'undefined' && currentSubListener) ? currentSubListener : 'JAGUAR_1';

            db.ref(`history/${deviceId}`).once('value').then(snapshot => {
                const datesData = snapshot.val();
                if (!datesData) {
                    alert("Không có dữ liệu lịch sử cho thiết bị này!");
                    return;
                }

                let rawData = [];

                for (let dateKey in datesData) {
                    let timesData = datesData[dateKey];
                    for (let timeKey in timesData) {
                        let record = timesData[timeKey];
                        if (record && record.timestamp) {
                            let recTime = new Date(record.timestamp.replace(" ", "T")).getTime();
                            if (recTime >= startTime && recTime <= endTime) {
                                rawData.push({
                                    time: record.timestamp,
                                    temp: record.temperature || 0,
                                    press: record.pressure || 0,
                                    volt: record.voltage || 0,
                                    freq: record.frequency || 0
                                });
                            }
                        }
                    }
                }

                if (rawData.length === 0) {
                    alert("Không tìm thấy dữ liệu trong khoảng thời gian này!");
                    return;
                }

                rawData.sort((a, b) => new Date(a.time.replace(" ", "T")) - new Date(b.time.replace(" ", "T")));

                const MAX_POINTS = 50; 
                let processedData = [];

                if (rawData.length > MAX_POINTS) {
                    let step = rawData.length / MAX_POINTS;
                    for (let i = 0; i < MAX_POINTS; i++) {
                        let index = Math.floor(i * step);
                        processedData.push(rawData[index]);
                    }
                    processedData.push(rawData[rawData.length - 1]);
                } else {
                    processedData = rawData;
                }

                let timestamps = processedData.map(item => item.time);
                let tempVals = processedData.map(item => item.temp);
                let pressVals = processedData.map(item => item.press);
                let voltVals = processedData.map(item => item.volt);
                let freqVals = processedData.map(item => item.freq);

                let datasets = [];

                if (document.getElementById('c-temp') && document.getElementById('c-temp').checked) {
                    datasets.push({
                        label: 'Temp (°C)',
                        data: tempVals,
                        borderColor: '#ef4444',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.2,
                        pointRadius: 0,
                        pointHoverRadius: 4
                    });
                }
                if (document.getElementById('c-press') && document.getElementById('c-press').checked) {
                    datasets.push({
                        label: 'Press (MPa)',
                        data: pressVals,
                        borderColor: '#3b82f6',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.2,
                        pointRadius: 0,
                        pointHoverRadius: 4
                    });
                }
                if (document.getElementById('c-volt') && document.getElementById('c-volt').checked) {
                    datasets.push({
                        label: 'Volt (V)',
                        data: voltVals,
                        borderColor: '#eab308',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.2,
                        pointRadius: 0,
                        pointHoverRadius: 4
                    });
                }
                if (document.getElementById('c-freq') && document.getElementById('c-freq').checked) {
                    datasets.push({
                        label: 'Freq (Hz)',
                        data: freqVals,
                        borderColor: '#22c55e',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.2,
                        pointRadius: 0,
                        pointHoverRadius: 4
                    });
                }

                historyChart.data.labels = timestamps;
                historyChart.data.datasets = datasets;
                historyChart.update();
            }).catch(error => {
                console.error("Lỗi tải lịch sử:", error);
                alert("Lỗi khi kết nối lấy dữ liệu lịch sử!");
            });
        }

db.ref(".info/connected").on("value", (snap) => { document.getElementById('conn-status').innerText = snap.val() ? "📶 Online" : "❌ Offline"; });
</script>
</body>
